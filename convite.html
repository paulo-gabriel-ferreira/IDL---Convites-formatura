<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Você recebeu um convite</title>
<meta name="description" content="Convite do Instituto Dente de Leão para a Banca Final IDL Tech.">
<meta property="og:title" content="Você recebeu um convite">
<meta property="og:description" content="Instituto Dente de Leão convida para a Banca Final IDL Tech. Toque para abrir.">
<meta name="theme-color" content="#0d0914">
<link rel="icon" href="/assets/simbolo.png">
<link rel="stylesheet" href="/css/fonts.css">
<style>
  html,body{margin:0;padding:0;background:#0a0710;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  a{color:#e2be7a;text-decoration:none}
  a:hover{color:#f3dfae}
  img{display:block;max-width:100%}
  @keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  @keyframes floaty{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(-160px) scale(1);opacity:0}}
  @keyframes ctaGlow{0%,100%{box-shadow:0 8px 28px rgba(226,190,122,.35),0 0 0 0 rgba(226,190,122,.55);transform:scale(1)}50%{box-shadow:0 10px 36px rgba(226,190,122,.5),0 0 0 14px rgba(226,190,122,0);transform:scale(1.04)}}
  @keyframes sealGlow{0%,100%{box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 0 0 rgba(226,190,122,.55)}50%{box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 0 12px rgba(226,190,122,0)}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .root{position:relative;min-height:100vh;background:#0a0710;color:#f4ecdc;font-family:'Poppins',sans-serif;overflow-x:hidden}

  /* ---------- Tela de carregamento / erro */
  .estado{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;text-align:center;background:#0d0914;color:#cbbfd9;font-family:'Poppins',sans-serif;z-index:60}
  .estado img{width:64px;height:64px;animation:spin 8s linear infinite}
  .estado h1{margin:0;font-size:20px;font-weight:600;color:#f4ecdc}
  .estado p{margin:0;max-width:320px;font-size:15px;line-height:1.6}

  /* ---------- Envelope (abertura) */
  .gate{position:fixed;inset:0;z-index:50;perspective:1800px;cursor:pointer;transition:opacity .9s ease;-webkit-tap-highlight-color:transparent}
  .gate:focus-visible{outline:2px solid #e2be7a;outline-offset:-6px}
  .door{position:absolute;top:0;bottom:0;width:50.2%;overflow:hidden;background:#110b1a;transition:transform 1.8s cubic-bezier(.66,0,.24,1) 2.1s}
  .door img{position:absolute;top:50%;width:130vmin;height:130vmin;opacity:.09;max-width:none}
  .door.l{left:0;transform-origin:left center}
  .door.l img{right:0;transform:translate(50%,-50%)}
  .door.r{right:0;transform-origin:right center}
  .door.r img{left:0;transform:translate(-50%,-50%)}
  .env-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:48px 24px;text-align:center;pointer-events:none;transition:opacity .5s ease 2s}
  .gate-txt{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:300px;transition:opacity .25s ease}
  .gate-top{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#e2be7a;font-weight:500;padding-left:.28em}
  .gate-name{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.01em;color:#f4ecdc;text-wrap:balance}
  .env{position:relative;width:min(290px,76vw);aspect-ratio:290/200;perspective:900px;animation:float 4s ease-in-out infinite}
  .env-back{position:absolute;inset:0;border-radius:8px;background:#1a1422;box-shadow:0 28px 60px rgba(0,0,0,.5)}
  .env-card{position:absolute;left:7%;right:7%;top:8%;height:84%;border-radius:6px;background:#16101f;display:flex;align-items:flex-start;justify-content:center;padding-top:10%;transition:transform .8s cubic-bezier(.3,0,.2,1)}
  .env-card img{width:34%;height:auto}
  .env-front{position:absolute;inset:0;border-radius:8px;overflow:hidden;pointer-events:none}
  .env-front div{position:absolute;inset:0}
  .env-flap{position:absolute;top:0;left:0;right:0;height:58%;transform-origin:top center;transition:transform .6s cubic-bezier(.6,0,.3,1) .15s;z-index:2}
  .env-flap div{position:absolute;inset:0;background:linear-gradient(165deg,#f3dfae 0%,#e2be7a 45%,#a8823f 100%);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:8px 8px 0 0}
  .seal{position:absolute;left:50%;top:58%;width:56px;height:56px;margin:-28px 0 0 -28px;z-index:3;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0d0914;border:2px solid #e2be7a;animation:sealGlow 2.4s ease-in-out infinite;transition:opacity .25s ease,transform .35s ease}
  .seal img{width:30px;height:30px}
  .tap{display:flex;align-items:center;justify-content:center;height:56px;min-width:220px;padding:0 32px 0 calc(32px + .2em);border-radius:999px;background:linear-gradient(100deg,#a8823f 0%,#f3dfae 45%,#e2be7a 70%,#a8823f 100%);background-size:200% 100%;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#1a0b36;font-weight:600;animation:shimmer 4s linear infinite,ctaGlow 2.2s ease-in-out infinite}

  .opening .door.l{transform:rotateY(-108deg)}
  .opening .door.r{transform:rotateY(108deg)}
  .opening .env-wrap,.opening .gate-txt,.opening .seal{opacity:0}
  .opening .seal{transform:scale(1.5)}
  .opening .env-flap{transform:rotateX(180deg)}
  .flap-back .env-flap{z-index:-1}
  .card-up .env-card{transform:translateY(-104%)}
  .fading .gate{opacity:0}

  /* ---------- Abertura do convite */
  .hero{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:88px 24px 48px;text-align:center;overflow:hidden;background:#0d0914}
  .particles{position:absolute;inset:0;pointer-events:none}
  .particles span{position:absolute;border-radius:50%;background:#f3dfae;box-shadow:0 0 10px 2px rgba(243,223,174,.55);opacity:0}
  .hero-in{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:28px;max-width:520px;opacity:0;transform:scale(1.06) translateY(12px);transition:opacity 1.4s ease 2.5s,transform 2.2s cubic-bezier(.2,.7,.2,1) 2.3s}
  .live .hero-in{opacity:1;transform:none}
  .skip .hero-in{transition:opacity 1s ease,transform 1.4s cubic-bezier(.2,.7,.2,1)}
  .hero-logo{width:104px;height:104px;animation:spin 60s linear infinite;filter:drop-shadow(0 0 24px rgba(226,190,122,.35))}
  h1{margin:0;font-weight:600;font-size:clamp(34px,10vw,60px);line-height:1.08;letter-spacing:-.025em;display:flex;flex-direction:column;gap:2px;max-width:100%}
  .t-a{color:#f4ecdc;font-weight:300;text-wrap:balance}
  .t-b{background:linear-gradient(100deg,#a8823f 0%,#f3dfae 25%,#e2be7a 50%,#a8823f 75%,#f3dfae 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite;padding-bottom:4px;text-wrap:balance}
  .ev{display:flex;flex-direction:column;gap:6px}
  .ev-nome{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#e2be7a;padding-left:.22em}
  .ev-sub{font-size:16px;font-weight:300;color:#cbbfd9}

  /* ---------- Carta */
  .sec{display:flex;justify-content:center}
  .carta-sec{padding:8px 16px 72px}
  .carta{position:relative;width:100%;max-width:520px;overflow:hidden;border-radius:20px;background:#16101f;border:1px solid rgba(226,190,122,.35);padding:48px 24px 40px}
  .carta-bg{position:absolute;top:-90px;right:-110px;width:300px;height:300px;opacity:.07;pointer-events:none}
  .carta-in{position:relative;display:flex;flex-direction:column;gap:20px}
  .saud{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.01em;color:#f3dfae;text-wrap:balance;padding-right:24px}
  .carta p{margin:0;font-size:16px;font-weight:400;line-height:1.7;color:#e9e0f1;text-wrap:pretty}
  .assin{display:flex;align-items:center;gap:14px;padding-top:12px}
  .assin img{width:40px;height:40px;flex:none}
  .assin-d{font-size:13px;font-weight:300;color:#cbbfd9}
  .assin-n{font-size:16px;font-weight:600;line-height:1.3;color:#f4ecdc}

  /* ---------- Quando e onde */
  .quando-sec{padding:0 16px 72px}
  .quando{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .box{border-radius:20px;background:#16101f;padding:24px 20px;display:flex;flex-direction:column;gap:6px}
  .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#e2be7a;font-weight:500}
  .big{font-size:40px;font-weight:600;line-height:1;letter-spacing:-.03em;color:#f4ecdc}
  .small{font-size:15px;font-weight:400;color:#e9e0f1}
  .local{border-radius:20px;background:#16101f;overflow:hidden;display:flex;flex-direction:column}
  .local-in{padding:24px 20px 20px;display:flex;flex-direction:column;gap:6px}
  .local-nome{font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.01em;color:#f4ecdc}
  .local-end{font-size:14px;line-height:1.6;color:#cbbfd9;text-wrap:pretty}
  .local iframe{display:block;width:100%;height:220px;border:0}
  .chegar{display:flex;align-items:center;justify-content:center;height:56px;color:#f3dfae;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;padding-left:.2em}
  .chegar:hover{background:rgba(226,190,122,.1)}

  /* ---------- Confirmação */
  .rsvp-sec{padding:32px 24px 80px}
  .rsvp{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
  .rsvp img{width:48px;height:48px}
  h2{margin:0;font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-.02em;color:#f4ecdc;text-wrap:balance}
  .btn-rsvp{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border-radius:999px;background:linear-gradient(100deg,#b8914a 0%,#f3dfae 45%,#e2be7a 70%,#b8914a 100%);color:#0d0914;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding-left:.16em;box-shadow:0 10px 40px rgba(226,190,122,.22)}
  .btn-rsvp:hover{color:#0d0914;box-shadow:0 12px 50px rgba(226,190,122,.4)}
  a:focus-visible{outline:2px solid #e2be7a;outline-offset:3px;border-radius:999px}

  footer{padding:32px 24px calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:28px 40px}
  footer .f1{width:160px;height:auto}
  footer .f2{width:112px;height:auto}

  [data-reveal]{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].on{opacity:1;transform:none}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important}
    .door,.env-wrap,.hero-in,[data-reveal]{transition-duration:.01s!important;transition-delay:0s!important}
    .particles{display:none}
  }
</style>
</head>
<body>
<div class="estado" id="estado" role="status">
  <img src="/assets/simbolo.png" alt="">
  <h1 id="estado-t" hidden></h1>
  <p id="estado-p" hidden></p>
</div>

<div class="root" id="root" hidden>
  <div class="gate" id="gate" role="button" tabindex="0" aria-label="Abrir o convite">
    <div class="door l"><img src="/assets/simbolo.png" alt=""></div>
    <div class="door r"><img src="/assets/simbolo.png" alt=""></div>
    <div class="env-wrap">
      <div class="gate-txt">
        <div class="gate-top" data-f="chamada"></div>
        <div class="gate-name" data-f="nome"></div>
      </div>
      <div class="env">
        <div class="env-back"></div>
        <div class="env-card"><img src="/assets/simbolo.png" alt=""></div>
        <div class="env-front">
          <div style="background:#241b30;clip-path:polygon(0 0,52% 56%,0 100%)"></div>
          <div style="background:#241b30;clip-path:polygon(100% 0,48% 56%,100% 100%)"></div>
          <div style="background:#1e1728;clip-path:polygon(0 100%,50% 50%,100% 100%)"></div>
        </div>
        <div class="env-flap"><div></div></div>
        <div class="seal"><img src="/assets/simbolo.png" alt=""></div>
      </div>
      <div class="tap">Toque para abrir</div>
    </div>
  </div>

  <section class="hero">
    <div class="particles" id="particles"></div>
    <div class="hero-in">
      <img class="hero-logo" src="/assets/simbolo.png" alt="">
      <h1><span class="t-a" data-f="titulo_a"></span><span class="t-b" data-f="titulo_b"></span></h1>
      <div class="ev">
        <div class="ev-nome" data-e="nome"></div>
        <div class="ev-sub" data-e="subtitulo"></div>
      </div>
    </div>
  </section>

  <section class="sec carta-sec">
    <div class="carta">
      <img class="carta-bg" src="/assets/simbolo.png" alt="">
      <div class="carta-in" id="carta">
        <div class="saud" data-reveal data-f="saudacao"></div>
        <div id="paragrafos" style="display:contents"></div>
        <div class="assin" data-reveal>
          <img src="/assets/simbolo.png" alt="">
          <div>
            <div class="assin-d" data-f="despedida"></div>
            <div class="assin-n">Instituto Dente de Leão</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec quando-sec">
    <div class="quando">
      <div class="grid2" data-reveal>
        <div class="box">
          <div class="lbl" data-e="dia_semana"></div>
          <div class="big" data-e="dia"></div>
          <div class="small" data-e="mes"></div>
        </div>
        <div class="box">
          <div class="lbl">Horário</div>
          <div class="big" data-e="hora_inicio"></div>
          <div class="small" data-e="hora_fim"></div>
        </div>
      </div>
      <div class="local" data-reveal>
        <div class="local-in">
          <div class="lbl">Local</div>
          <div class="local-nome" data-e="local_nome"></div>
          <div class="local-end" data-e="local_endereco"></div>
        </div>
        <iframe id="mapa" title="Mapa do local" loading="lazy"></iframe>
        <a class="chegar" id="chegar" target="_blank" rel="noopener">Como chegar</a>
      </div>
    </div>
  </section>

  <section class="sec rsvp-sec">
    <div class="rsvp" data-reveal>
      <img src="/assets/simbolo.png" alt="">
      <h2 data-f="pergunta"></h2>
      <a class="btn-rsvp" id="rsvp" target="_blank" rel="noopener">Confirmar presença</a>
    </div>
  </section>

  <footer>
    <img class="f1" src="/assets/logo-idl.png" alt="Instituto Dente de Leão">
    <img class="f2" src="/assets/logo-idl-tech.png" alt="Programa IDL Tech">
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var PREVIEW = qs.get('preview') === '1';
  var root = document.getElementById('root');
  var timers = [];

  function estado(titulo, texto) {
    var t = document.getElementById('estado-t'), p = document.getElementById('estado-p');
    t.textContent = titulo; p.textContent = texto; t.hidden = false; p.hidden = false;
    document.getElementById('estado').hidden = false;
  }

  function trocaNome(txt, nome) { return String(txt || '').split('{nome}').join(nome); }

  function render(convite, evento) {
    var nome = (convite.nome || '').trim();
    var c = {};
    Object.keys(convite).forEach(function (k) { c[k] = trocaNome(convite[k], nome); });

    document.title = nome ? 'Convite para ' + nome : 'Você recebeu um convite';
    root.querySelectorAll('[data-f]').forEach(function (el) { el.textContent = c[el.dataset.f] || ''; });
    root.querySelectorAll('[data-e]').forEach(function (el) { el.textContent = evento[el.dataset.e] || ''; });

    var box = document.getElementById('paragrafos');
    box.innerHTML = '';
    String(c.paragrafos || '').split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean)
      .forEach(function (txt) {
        var p = document.createElement('p');
        p.setAttribute('data-reveal', '');
        p.textContent = txt;
        box.appendChild(p);
      });

    var end = evento.local_endereco || '';
    document.getElementById('mapa').src = 'https://www.google.com/maps?q=' + encodeURIComponent(end) + '&z=16&output=embed';
    document.getElementById('chegar').href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(end);

    var zap = String(evento.whatsapp || '').replace(/\D/g, '');
    var msg = trocaNome(evento.mensagem_rsvp, nome);
    document.getElementById('rsvp').href = 'https://wa.me/' + zap + (msg ? '?text=' + encodeURIComponent(msg) : '');

    document.getElementById('estado').hidden = true;
    root.hidden = false;
    armReveal();
  }

  /* ---------- Partículas */
  (function () {
    var box = document.getElementById('particles');
    for (var i = 0; i < 40; i++) {
      var s = 2 + Math.random() * 3, el = document.createElement('span');
      el.style.cssText = 'left:' + (Math.random() * 100) + '%;top:' + (35 + Math.random() * 65) + '%;width:' + s + 'px;height:' + s + 'px;animation:floaty ' + (5 + Math.random() * 6).toFixed(2) + 's linear ' + (Math.random() * 8).toFixed(2) + 's infinite';
      box.appendChild(el);
    }
  })();

  /* ---------- Revelar ao rolar */
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -6% 0px' }) : null;
  function armReveal() {
    root.querySelectorAll('[data-reveal]:not(.on)').forEach(function (el) {
      if (io) io.observe(el); else el.classList.add('on');
    });
  }

  /* ---------- Abertura do envelope */
  var gate = document.getElementById('gate');
  function semAbertura() {
    gate.remove();
    root.classList.add('live', 'skip');
    document.documentElement.style.overflow = '';
  }
  function abrir() {
    if (root.classList.contains('opening')) return;
    root.classList.add('opening', 'live');
    timers.push(setTimeout(function () { root.classList.add('flap-back'); }, 450));
    timers.push(setTimeout(function () { root.classList.add('card-up'); }, 550));
    timers.push(setTimeout(function () { root.classList.add('fading'); }, 3200));
    timers.push(setTimeout(function () { gate.remove(); document.documentElement.style.overflow = ''; }, 4200));
  }
  gate.addEventListener('click', abrir);
  gate.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });

  function prepararAbertura() {
    if (qs.get('aberto') === '1') semAbertura();
    else document.documentElement.style.overflow = 'hidden';
  }

  /* ---------- Modo prévia (usado pelo painel) */
  if (PREVIEW) {
    prepararAbertura();
    window.addEventListener('message', function (ev) {
      if (ev.origin !== location.origin) return;
      var d = ev.data || {};
      if (d.tipo === 'convite-previa') render(d.convite || {}, d.evento || {});
    });
    parent.postMessage({ tipo: 'previa-pronta' }, location.origin);
    return;
  }

  /* ---------- Convite real, pelo link /c/slug */
  var cfg = window.CONVITES_CONFIG || {};
  var partes = location.pathname.split('/').filter(Boolean);
  var slug = partes[0] === 'c' ? decodeURIComponent(partes[1] || '') : (qs.get('c') || '');

  if (!slug) { estado('Convite não encontrado', 'Este endereço não tem um convite. Confira se o link foi copiado inteiro.'); return; }
  if (!window.supabase || !cfg.SUPABASE_URL || cfg.SUPABASE_URL.indexOf('SEU-PROJETO') > -1) {
    estado('Convite indisponível', 'O site ainda não foi ligado ao banco de dados. Avise a equipe do Instituto Dente de Leão.'); return;
  }

  var db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  db.rpc('abrir_convite', { p_slug: slug, p_registrar: qs.get('painel') !== '1' }).then(function (r) {
    if (r.error) { estado('Não foi possível abrir o convite', 'Verifique sua internet e tente de novo em alguns instantes.'); return; }
    if (!r.data) { estado('Convite não encontrado', 'Este link não corresponde a nenhum convite. Confira se ele foi copiado inteiro.'); return; }
    prepararAbertura();
    render(r.data.convite, r.data.evento);
  });
})();
</script>
</body>
</html>
